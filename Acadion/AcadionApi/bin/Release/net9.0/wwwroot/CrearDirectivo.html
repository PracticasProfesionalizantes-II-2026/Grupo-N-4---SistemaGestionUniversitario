<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Acadion | Crear directivo</title><link rel="stylesheet" href="CrearDirectivo.css"><link rel="stylesheet" href="Admin.css"></head>
<body data-section="admin" data-page="SeleccionarRol" data-role-id="4"><div class="app-layout"><aside class="sidebar" id="sidebar"></aside><main class="main-content">
<header class="topbar"><a class="back-button" href="SeleccionarRol.html" aria-label="Volver">←</a><div class="header-actions"><a class="profile-avatar" href="MisDatosPersonales.html">US</a></div></header>
<section class="page-content"><div class="admin-heading"><div><p class="section-kicker">Gestión de usuarios</p><h1>Crear directivo</h1><p>La cuenta tendrá acceso institucional de consulta y reportes.</p></div></div>
<form id="userForm" class="admin-grid"><section class="panel"><h2>Datos personales</h2><div class="inline-grid"><label class="form-field">Nombre<input name="nombre" required></label><label class="form-field">Apellido<input name="apellido" required></label><label class="form-field">DNI<input name="dni" type="number" min="1000000" required></label><label class="form-field">Fecha de nacimiento<input name="fechaNacimiento" type="date" required></label></div></section>
<section class="panel"><h2>Contacto</h2><div class="inline-grid"><label class="form-field span-2">Dirección<input name="direccion" required></label><label class="form-field">Localidad<input name="localidad" required></label><label class="form-field">Código postal<input name="codigoPostal" type="number" min="1" required></label><label class="form-field">Email personal<input name="emailPersonal" type="email" required></label><label class="form-field">Email institucional<input name="emailInstitucional" type="email" required></label><label class="form-field span-2">Teléfono<input name="telefonoContacto" type="tel" required></label></div></section>
<section id="credentialResult" class="credential-box full-width" hidden><strong>Cuenta institucional creada</strong><dl><dt>Rol</dt><dd id="createdRole"></dd><dt>Usuario</dt><dd id="createdUsername"></dd><dt>Contraseña inicial</dt><dd id="createdPassword"></dd></dl><p class="field-help">Entregale estos datos al directivo. Al ingresar podrá cambiar su contraseña.</p></section>
<div class="form-actions full-width"><a class="secondary-button" href="SeleccionarRol.html">Cancelar</a><button class="primary-button" type="submit">Crear cuenta</button></div><p id="formMessage" class="status-message full-width" role="status"></p></form></section>
</main></div><script src="Api.js"></script><script src="Comun.js"></script><script src="CrearUsuario.js"></script></body></html>
