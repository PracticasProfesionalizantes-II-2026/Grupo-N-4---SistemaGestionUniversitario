<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acadion | Crear clase</title>
  <link rel="stylesheet" href="CrearClase.css">
</head>
<body data-section="admin" data-page="CrearClase">
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <header class="topbar"><a class="back-button" href="PanelSecretaria.html" aria-label="Volver al inicio">←</a></header>
      <section class="page-content">
        <h1>Crear clase</h1><section class="panel"><h2>Información de la clase</h2><form class="local-form" data-return="Clases.html"><div class="form-grid"><label class="form-field">Código<input name="Código" type="text" value="" required></label><label class="form-field">Nombre de la clase<input name="Nombre de la clase" type="text" value="" required></label><label class="form-field">Profesor<input name="Profesor" type="text" value="" required></label><label class="form-field">Nivel<input name="Nivel" type="text" value="" required></label><label class="form-field">Días<input name="Días" type="text" value="" required></label><label class="form-field">Aula<input name="Aula" type="text" value="" required></label><label class="form-field">Hora de inicio<input name="inicio" type="time" value="" required></label><label class="form-field">Hora de fin<input name="fin" type="time" value="" required></label></div><p id="formMessage" role="status"></p><div class="form-actions"><a class="secondary-button" href="Clases.html">Cancelar</a><button class="primary-button">Crear clase</button></div></form></section>
      </section>
    </main>
  </div>
  <dialog id="statusDialog"><h2>Acadion</h2><p id="dialogMessage"></p><button id="closeDialog" class="primary-button">Entendido</button></dialog>
  <script src="Comun.js"></script>
  <script src="CrearClase.js"></script>
</body>
</html>
