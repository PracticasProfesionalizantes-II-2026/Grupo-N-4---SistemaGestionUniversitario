<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body data-section="student" data-page="CambiarFoto">
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <header class="topbar"><a class="back-button" href="Ajustes.html" aria-label="Volver a la pantalla anterior">←</a><div class="header-actions"><a class="profile-avatar" href="MisDatosPersonales.html" aria-label="Mis datos personales"></a></div></header>
      <section class="page-content">
        <h1>Ajustes</h1><section class="panel"><h2>Cambiar foto de perfil</h2><form id="photoForm"><label class="upload-box">Seleccionar foto<input id="photoFile" type="file" accept="image/png,image/jpeg,image/webp" required></label><img id="photoPreview" class="photo-preview" alt="Vista previa" hidden><div class="form-actions"><a class="secondary-button" href="Ajustes.html">Cancelar</a><button class="blue-button" type="submit">Guardar foto</button></div><p id="formMessage" role="status"></p></form></section>
      </section>
    </main>
  </div>
  <dialog id="statusDialog"><h2>Acadion</h2><p id="dialogMessage"></p><button id="closeDialog" class="primary-button">Entendido</button></dialog>

  <script src="Comun.js"></script>
