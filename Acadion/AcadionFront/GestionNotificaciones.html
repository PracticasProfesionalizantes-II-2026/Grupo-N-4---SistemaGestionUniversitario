<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Acadion | Notificaciones generales</title><link rel="stylesheet" href="GestionNotificaciones.css"><link rel="stylesheet" href="Admin.css"></head>
<body data-section="admin" data-page="GestionNotificaciones"><div class="app-layout"><aside class="sidebar" id="sidebar"></aside><main class="main-content">
<header class="topbar"><a class="back-button" href="PanelSecretaria.html" aria-label="Volver">←</a></header>
<section class="page-content"><div class="admin-heading"><div><p class="section-kicker">Comunicación institucional</p><h1>Notificaciones generales</h1><p>Publicá avisos para toda la comunidad o para un rol específico.</p></div></div>
<section class="panel"><form id="notificationForm"><div class="inline-grid"><label class="form-field">Título<input name="titulo" required maxlength="120" placeholder="Ej. Suspensión de actividades"></label><label class="form-field">Destinatarios<select name="rolDestinoId"><option value="">Toda la comunidad</option><option value="1">Estudiantes</option><option value="2">Profesores</option><option value="3">Secretaría</option><option value="4">Directivos</option></select></label><label class="form-field">Prioridad<select name="prioridad"><option>Normal</option><option>Alta</option><option>Baja</option></select></label><label class="form-field">Visible hasta<input name="fechaExpiracion" type="datetime-local"></label><label class="form-field span-2">Mensaje<textarea name="mensaje" required maxlength="2000" placeholder="Escribí el contenido del aviso..."></textarea></label></div><div class="form-actions"><button class="primary-button" type="submit">Publicar notificación</button></div><p id="notificationMessage" class="status-message" role="status"></p></form></section>
<section class="table-panel"><div class="panel-heading"><div><p class="section-kicker">Publicaciones</p><h2>Notificaciones cargadas</h2></div><button id="refreshNotifications" class="secondary-button" type="button">Actualizar</button></div><div id="notificationList"><p class="empty-state">Cargando notificaciones...</p></div></section>
</section></main></div><script src="Api.js?v=20261001-4"></script><script src="Comun.js"></script><script src="GestionNotificaciones.js"></script></body></html>
