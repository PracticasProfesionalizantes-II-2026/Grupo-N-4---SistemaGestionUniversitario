<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Acadion | Asistencia de alumnos</title><link rel="stylesheet" href="Docente.css"></head>
<body data-section="teacher" data-page="DocenteAsistencias">
  <div class="app-layout"><aside class="sidebar" id="sidebar"></aside><main class="main-content">
    <header class="topbar"><a class="back-button" href="PanelDocente.html" aria-label="Volver">←</a><div class="header-actions"><a class="profile-avatar" href="DocentePerfil.html" aria-label="Mi perfil"></a></div></header>
    <section class="page-content">
      <div class="admin-heading"><div><p class="section-kicker">Seguimiento académico</p><h1>Asistencia de alumnos</h1><p>Usamos “Tardanza” para registrar una llegada fuera de horario.</p></div></div>
      <section class="filter-bar attendance-filter">
        <label class="form-field attendance-subject-field">Materia<select id="attendanceSubject"></select></label>
        <label class="form-field">Fecha<input id="attendanceDate" type="date"></label>
        <label class="form-field">Tipo de clase<select id="classType"><option value="Presencial">Presencial</option><option value="Virtual">Virtual</option></select></label>
        <label class="form-field">Cantidad de inasistencias<input id="absenceCount" type="number" min="1" max="10" value="1" required></label>
        <button id="loadAttendance" class="primary-button" type="button">Ver comisión</button>
      </section>
      <div id="attendanceMessage" class="notice-strip" hidden></div>
      <section class="panel table-panel"><div class="attendance-actions"><div><p class="section-kicker">Comisión</p><h2 id="attendanceTitle">Seleccioná una materia</h2></div><button id="markAllPresent" class="secondary-button" type="button" disabled>Marcar todos presentes</button></div>
        <div class="table-wrapper"><table><thead><tr><th>Estudiante</th><th>Legajo</th><th>Estado</th><th>Observaciones</th></tr></thead><tbody id="attendanceBody"><tr><td colspan="4" class="empty-state">Seleccioná una materia y una fecha.</td></tr></tbody></table></div>
        <div class="form-actions"><button id="saveAttendance" class="primary-button" type="button" disabled>Guardar asistencia</button></div>
      </section>
    </section>
  </main></div>
  <script src="Api.js"></script><script src="Comun.js"></script><script src="DocenteAsistencias.js"></script>
</body></html>
