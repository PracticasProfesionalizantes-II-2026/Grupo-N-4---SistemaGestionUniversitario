<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Acadion</title></head>
<body>
  <p>Abriendo Acadion...</p>
  <script src="Api.js?v=20261001-4"></script>
  <script>
    const session = AcadionApi.getSession();
    const isAdmin = session?.rol === "Secretario" || session?.permisos?.includes("usuarios.gestionar");
    const isTeacher = session?.rol === "Docente" || session?.permisos?.includes("docencia.gestionar");
    const isDirector = session?.rol === "Directivo" && session?.permisos?.includes("reportes.leer");
    const destination = isDirector ? "PanelInstitucional.html" : isAdmin ? "PanelSecretaria.html" : isTeacher ? "PanelDocente.html" : "MenuPrincipal.html";
    window.location.replace(session?.usuarioId ? destination : "Login.html");
  </script>
</body>
</html>
