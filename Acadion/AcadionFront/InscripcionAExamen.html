<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acadion | Inscripción a exámenes</title>
  <link rel="stylesheet" href="InscripcionAExamen.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div>
        <a class="logo" href="MenuPrincipal.html">Acadion<span>.</span></a>
        <nav class="menu" aria-label="Menú principal">
          <a class="menu-item" href="MenuPrincipal.html"><span class="menu-icon">⌂</span>Inicio</a>
          <a class="menu-item" href="InscripcionAMateria.html"><span class="menu-icon">▣</span>Inscripción a materias</a>
          <a class="menu-item active" href="InscripcionAExamen.html" aria-current="page"><span class="menu-icon">▤</span>Inscripción a exámenes</a>
          <a class="menu-item" href="MateriasEnCurso.html"><span class="menu-icon">◫</span>Reportes</a>
          <a class="menu-item" href="MisDatosPersonales.html"><span class="menu-icon">♙</span>Mis datos personales</a>
        </nav>
      </div>
      <button id="logoutButton" class="logout-button" type="button">Cerrar sesión</button>
    </aside>

    <main class="main-content exam-main">
      <header class="exam-topbar">
        <a class="back-to-home" href="MenuPrincipal.html" aria-label="Volver al menú principal">←</a>
        <div class="topbar-actions">
          <button class="notification-button" type="button" aria-label="Notificaciones">♧<span class="notification-dot"></span></button>
          <img id="profileImage" class="profile-image" src="https://ui-avatars.com/api/?name=Estudiante&background=ff7a00&color=fff&bold=true" alt="Foto de perfil">
        </div>
      </header>

      <section class="exam-panel">
        <div class="page-heading">
          <p class="eyebrow">GESTIÓN ACADÉMICA</p>
          <h1>Inscripción a exámenes</h1>
          <p>Consultá las mesas disponibles para las materias que cursás.</p>
        </div>

        <div class="toolbar">
          <label class="search-box"><span aria-hidden="true">⌕</span><input id="searchInput" type="search" placeholder="Buscar examen..."></label>
          <div class="toggle-group" role="group" aria-label="Filtrar exámenes">
            <button class="toggle is-active" type="button" data-filter="all">Ver todos</button>
            <button class="toggle" type="button" data-filter="enrolled">Solo inscripciones</button>
          </div>
        </div>

        <div id="statusMessage" class="status-message is-hidden" role="status"></div>
        <div id="globalState" class="global-state is-hidden" role="status"></div>

        <div id="masterDetail" class="master-detail">
          <section class="subject-list-panel" aria-labelledby="subjectsTitle">
            <h2 id="subjectsTitle">Mesas disponibles</h2>
            <div id="subjectsList" class="subjects-list"></div>
          </section>
          <section id="detailPanel" class="detail-panel" aria-live="polite">
            <div class="empty-detail"><span>▤</span><p>Seleccioná un examen para ver sus detalles.</p></div>
          </section>
        </div>
      </section>
    </main>
  </div>

  <script src="Api.js"></script>
  <script src="InscripcionAExamen.js"></script>
</body>
</html>
