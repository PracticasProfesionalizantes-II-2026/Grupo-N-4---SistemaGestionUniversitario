<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acadion | Crear Secretario</title>
  <link rel="stylesheet" href="CrearSecretario.css">
</head>
<body data-section="admin" data-page="CrearSecretario">
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <header class="topbar"><a class="back-button" href="PanelDirectivo.html" aria-label="Volver al inicio">←</a><div class="header-actions"><a href="Ajustes.html">Ajustes</a><a class="profile-avatar" href="MisDatosPersonales.html">FM</a></div></header>
      <section class="page-content">
        <h1>Crear Secretario</h1><form class="local-form"><div class="form-grid"><section class="panel"><h2>Cuenta</h2><label class="form-field">Usuario<input name="usuario" type="text" value="" required></label><label class="form-field">Contraseña<input name="password" type="password" value="" required></label></section><section class="panel"><h2>Información de contacto</h2><label class="form-field">Celular<input name="telefono" type="tel" value="" required></label><label class="form-field">Email<input name="email" type="email" value="" required></label><label class="form-field">Dirección<input name="direccion" type="text" value="" required></label></section><section class="panel"><h2>Información</h2><label class="form-field">Nombre<input name="nombre" type="text" value="" required></label><label class="form-field">Apellido<input name="apellido" type="text" value="" required></label><label class="form-field">Fecha de nacimiento<input name="nacimiento" type="date" value="" required></label><label class="form-field">Género<select name="genero"><option>Masculino</option><option>Femenino</option><option>Otro</option></select></label></section><section class="panel"><h2>Información adicional</h2><label><input type="checkbox" name="transporte"> Usa transporte</label><br><label><input type="checkbox" name="beca"> Beca</label></section></div><div class="form-actions"><a class="secondary-button" href="SeleccionarRol.html">Cancelar</a><button class="primary-button">Guardar</button></div><p id="formMessage" role="status"></p></form>
      </section>
    </main>
  </div>
  <dialog id="statusDialog"><h2>Acadion</h2><p id="dialogMessage"></p><button id="closeDialog" class="primary-button">Entendido</button></dialog>
  <script src="Comun.js"></script>
  <script src="CrearSecretario.js"></script>
</body>
</html>
